spring:
  application:
    name: ai-runbook-service
  profiles:
    default: local
runbook:
  enabled: true
  artifacts-root: ./build/runbook-artifacts
  generation:
    mode: DIRECT_STRUCTURED
  ai:
    base-url: ${RUNBOOK_AI_BASE_URL:}
    auth-url: ${RUNBOOK_AI_AUTH_URL:}
    model: ${RUNBOOK_AI_MODEL:gpt-4o}
    username: ${RUNBOOK_AI_USERNAME:}
    password: ${RUNBOOK_AI_PASSWORD:}
    connect-timeout-seconds: ${RUNBOOK_AI_CONNECT_TIMEOUT_SECONDS:300}
    request-timeout-seconds: ${RUNBOOK_AI_REQUEST_TIMEOUT_SECONDS:900}
    max-tokens: ${RUNBOOK_AI_MAX_TOKENS:12000}
    temperature: 0.0
  collection:
    max-files: 120
    max-total-characters: 300000
    max-file-characters: 20000
  agent:
    type: local
    executable: idfc-coder
    timeout: 30m
    max-captured-log-bytes: 1048576
  executor:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 20
  validation:
    require-complete-scan-for-production: true
    minimum-rendered-bytes: 2000
  confluence:
    enabled: false
    protected-page-ids: []
  targets: {}
